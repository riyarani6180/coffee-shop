<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Riya Rani">
    <meta name="description" content="Contact information for The Little Coffee Shop">
    <title>Contact Us | LCS</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
                url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            animation: zoomBg 18s infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

     

        .container {
            width: 90%;
            max-width: 900px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            animation: fadeIn 1.8s ease;
        }

        h1 {
            font-size: 2.8rem;
            color: #ffcc80;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            transition: 0.3s;
        }

        nav a:hover {
            background: #ffcc80;
            color: #000;
        }

        figure img {
            width: 280px;
            border-radius: 18px;
            margin: 20px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            animation: float 4s infinite ease-in-out;
        }

      

        figcaption {
            font-style: italic;
            opacity: 0.85;
        }

        main {
            margin-top: 25px;
        }

        section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 2rem;
            color: #ffcc80;
            margin-bottom: 15px;
        }

        form {
            background: rgba(0,0,0,0.4);
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            margin: auto;
        }

        fieldset {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 20px;
            border-radius: 12px;
        }

        legend {
            padding: 0 10px;
            color: #ffcc80;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            outline: none;
        }

        textarea {
            resize: none;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background: #ffcc80;
            transition: 0.3s;
        }

        button:hover {
            background: #ffd699;
            transform: scale(1.05);
        }

        address {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 15px;
            width: 70%;
            margin: auto;
            font-style: normal;
            line-height: 1.7;
        }

        address a {
            color: #ffcc80;
            text-decoration: none;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Contact Us ☕</h1>

            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/#about">About LCS</a></li>
                    <li><a href="/#menu">Our Menu</a></li>
                    <li><a href="hours.html">Store Hours</a></li>
                </ul>
            </nav>

            <figure>
                <img src="coffee closeup.jpeg" alt="Little Coffee Shop Coffee">
                <figcaption>Freshly brewed coffee, ready to enjoy</figcaption>
            </figure>
        </header>

        <main>
            <section>
                <h2>Our Contact Form</h2>

                <form action="https://httpbin.org/get" method="get">
                    <fieldset>
                        <legend>Send Us a Message</legend>

                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email" required>

                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Type your message here"></textarea>
                    </fieldset>

                    <button type="submit">Send</button>
                    <button type="reset">Reset</button>
                </form>
            </section>

            <section>
                <h2>Our Location 📍</h2>
                <address>
                    Patia, Bhubaneswar – 8840<br>
                    Odisha, India<br><br>
                    Phone: <a href="tel:+5555555555">555-555-55555</a>
                </address>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 The Little Coffee Shop. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
